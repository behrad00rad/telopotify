<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d13">
  <title>Telopotify</title>
  <link rel="icon" href="/web/logo.png">
  <link rel="stylesheet" href="/web/styles.css">
  <script src="/web/app.js" defer></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM9 21v-8h6v8"/></symbol>
    <symbol id="i-songs" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 6l12-2M9 18c0 1.7-1.8 3-4 3s-4-1.3-4-3 1.8-3 4-3 4 1.3 4 3Zm12-2c0 1.7-1.8 3-4 3s-4-1.3-4-3 1.8-3 4-3 4 1.3 4 3Z"/></symbol>
    <symbol id="i-artists" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.4-7 8-7s8 2.5 8 7"/></symbol>
    <symbol id="i-albums" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.7a5 5 0 0 0-7 0L12 7.5l-1.8-1.8a5 5 0 0 0-7 7L12 21l8.8-8.3a5 5 0 0 0 0-7Z"/></symbol>
    <symbol id="i-playlists" viewBox="0 0 24 24"><path d="M3 5h12M3 10h12M3 15h8M18 12v9m-4.5-4.5h9"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M5 5v14m14-14L7 12l12 7z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M19 5v14M5 5l12 7-12 7z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.7"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7V3l-3 3a9 9 0 1 0 3.8 9M20 7h-5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  </svg>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand"><img src="/web/logo.png" alt="" width="40" height="40"><span>telopotify</span></div>
      <p class="nav-caption">BROWSE</p>
      <nav id="side-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot"><span class="status-dot" id="sidebar-dot"></span><span id="sidebar-status">Connecting</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="mobile-brand"><img src="/web/logo.png" alt="" width="31" height="31"><strong>telopotify</strong></div>
        <div class="search-box"><svg class="icon"><use href="#i-search"></use></svg><input id="search" type="search" placeholder="Search your music" aria-label="Search your music"></div>
        <button class="icon-btn refresh-btn" data-action="refresh" title="Refresh library" aria-label="Refresh library"><svg class="icon"><use href="#i-refresh"></use></svg></button>
        <button class="small-button web-signout" id="web-signout" data-action="web-logout" hidden>Sign out</button>
      </header>
      <div class="notice" id="notice" hidden></div>
      <div class="content" id="content"></div>
    </main>
    <div class="player" id="player"></div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="modal-root"></div>
  <audio id="audio" preload="none"></audio>
</body>
</html>
