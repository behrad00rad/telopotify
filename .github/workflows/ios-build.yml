name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Compile iOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TelopotifyApp/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install JavaScript dependencies
        run: npm ci --prefix TelopotifyApp
      - name: Install CocoaPods
        run: |
          bundle install --gemfile=TelopotifyApp/Gemfile
          cd TelopotifyApp/ios
          bundle exec pod install
      - name: Compile for iOS Simulator without signing
        run: |
          xcodebuild \
            -workspace TelopotifyApp/ios/TelopotifyApp.xcworkspace \
            -scheme TelopotifyApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/telopotify-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -workspace TelopotifyApp/ios/TelopotifyApp.xcworkspace \
            -scheme TelopotifyApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/telopotify-iphone" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA for local signing
        run: |
          mkdir -p "$RUNNER_TEMP/telopotify-ipa/Payload"
          ditto "$RUNNER_TEMP/telopotify-iphone/Build/Products/Release-iphoneos/TelopotifyApp.app" \
            "$RUNNER_TEMP/telopotify-ipa/Payload/TelopotifyApp.app"
          cd "$RUNNER_TEMP/telopotify-ipa"
          zip -qry "$RUNNER_TEMP/Telopotify-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Telopotify-unsigned-iPhone-IPA
          path: ${{ runner.temp }}/Telopotify-unsigned.ipa
          if-no-files-found: error
